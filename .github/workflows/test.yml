name: Test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

# Same Lisp bootstrap as egao1980/cl-repository (.github/workflows/test.yml):
# Roswell install-for-ci → pinned sbcl-bin → qlot → qlot exec ros.
env:
  SBCL_VERSION: 2.4.11

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        shell: bash
        run: |
          ros install qlot
          qlot install

      - name: Test event-protocol
        shell: bash
        run: |
          qlot exec ros -e '(asdf:test-system "event-protocol")'
