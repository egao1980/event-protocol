name: Test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

# Lisp bootstrap mirrors egao1980/cl-repository on Unix (install-for-ci → sbcl-bin → qlot).
# Windows: Roswell release zip (no pacman); skip qlot — qlot 1.8 uses sb-posix:symlink
# which SBCL does not export on Windows.
env:
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ros install qlot
          qlot install

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ros install rove

      - name: Test event-protocol (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          qlot exec ros -S . -e '(asdf:test-system "event-protocol")'

      - name: Test event-protocol (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:"
          ros -S . -e '(asdf:test-system "event-protocol")' -q
